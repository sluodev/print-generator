name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许手动触发，便于在仓库 Settings → Pages 切到 "GitHub Actions" 后立即重跑
  workflow_dispatch:

permissions:
  contents: read

# PR 上若多次推送，取消进行中的旧 workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 与 package.json 的 packageManager 字段一致
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build (Pages base path)
        run: pnpm build
        env:
          # 资源 URL 前缀必须是仓库名 + `/`，否则 Pages 上 CSS / JS 会 404
          PAGES_BASE: /print-generator/

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # GitHub Pages 一次只允许一个 in-flight 部署
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
