<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一笔画题纸生成器</title>
<!--
  与 queens_print_generator.html 共用 UI / PDF / 打印 / 持久化框架。
  题型差异：
    - 谜题 = n×n 网格上的哈密顿路径子图（玩家不重复走完所有激活格）
    - 生成 = 随机起点 + Warnsdorff 启发 + 回溯
    - 渲染 = 仅画激活格圆角矩形；起点 / 终点按 markMode 用更深的颜色覆盖
    - 难度 = 激活格比例（简单 50% / 中等 70% / 困难 90%）
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  .container {
    max-width: 210mm;
    margin: 0 auto;
    padding: 16px;
  }

  /* --- 控制面板 --- */
  .panel { margin-bottom: 16px; }
  .panel h1 {
    margin: 0 0 14px;
    font-size: 18px;
    font-weight: 700;
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .controls label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: #374151;
  }
  .controls label.full-row {
    grid-column: 1 / -1;
  }
  .controls select,
  .controls input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    background: #fff;
    font-size: 16px;
    color: #111827;
    appearance: none;
    -webkit-appearance: none;
  }
  .controls select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%236b7280' d='M6 8 0 0h12z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
  }
  .controls select:focus,
  .controls input:focus {
    outline: 2px solid #2563eb;
    outline-offset: 1px;
    border-color: #2563eb;
  }

  /* --- 按钮区 --- */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .actions button {
    padding: 14px 16px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
    transition: background-color .15s ease, transform .05s ease, box-shadow .15s ease;
  }
  .actions button:active { transform: translateY(1px); }
  .btn-primary   { background: #0ea5e9; }
  .btn-primary:hover { background: #0284c7; }
  .btn-tertiary  { background: #10b981; }
  .btn-tertiary:hover { background: #059669; }
  .btn-secondary { background: #ff7849; }
  .btn-secondary:hover { background: #ea5a30; }
  .btn-primary:disabled,
  .btn-secondary:disabled,
  .btn-tertiary:disabled {
    background: #c7c9d1;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* --- 输出区 --- */
  #output {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .empty-hint {
    padding: 32px 16px;
    color: #6b7280;
    text-align: center;
    font-size: 14px;
    background: #fff;
    border-radius: 12px;
    width: 100%;
  }

  /* --- A4 页面 --- */
  .page {
    background: #fff;
    width: 100%;
    max-width: 210mm;
    aspect-ratio: 210 / 297;
    padding: 5.71%;
    border-radius: 4px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, .08);
    display: flex;
    flex-direction: column;
    container-type: inline-size;
    color-adjust: exact;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    color: #4b5563;
    margin-bottom: 2.5%;
    font-size: 11pt;
    font-size: 1.85cqw;
  }

  .boards-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(3, 1fr);
    gap: 3.2cqw 4cqw;
    align-items: center;
    justify-items: center;
  }

  .board {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* --- 响应式 --- */
  @media (max-width: 480px) {
    .panel h1 { font-size: 17px; }
    .controls,
    .actions { gap: 10px; }
    .controls select,
    .controls input { font-size: 16px; padding: 11px 12px; }
    .actions { grid-template-columns: 1fr; }
    .actions button { padding: 13px; font-size: 15px; }
    .page { padding: 5.71%; }
    .boards-grid { gap: 3cqw 3.6cqw; }
  }

  /* --- 打印 --- */
  @page {
    size: A4 portrait;
    margin: 0;
  }

  @media print {
    html, body {
      background: #fff;
      margin: 0;
      padding: 0;
    }
    .container { padding: 0; max-width: none; }
    .no-print { display: none !important; }

    #output { gap: 0; }

    .page {
      width: 210mm;
      height: 297mm;
      max-width: none;
      aspect-ratio: auto;
      padding: 12mm;
      margin: 0;
      box-shadow: none;
      border-radius: 0;
      page-break-after: always;
      break-after: page;
    }
    .page:last-child {
      page-break-after: auto;
      break-after: auto;
    }
    .page-header {
      font-size: 10.5pt;
      margin-bottom: 6mm;
    }
    .boards-grid {
      gap: 6mm 8mm;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="panel no-print">
      <h1>一笔画题纸生成器</h1>
      <div class="controls">
        <label>
          <span>棋盘</span>
          <select id="size" aria-label="棋盘大小">
            <option value="4">4 × 4</option>
            <option value="5">5 × 5</option>
            <option value="6" selected>6 × 6</option>
            <option value="7">7 × 7</option>
          </select>
        </label>
        <label>
          <span>难度</span>
          <select id="difficulty" aria-label="难度">
            <option value="easy">简单（约 50% 格）</option>
            <option value="medium" selected>中等（约 70% 格）</option>
            <option value="hard">困难（约 90% 格）</option>
          </select>
        </label>
        <label>
          <span>起终点标记</span>
          <select id="markMode" aria-label="起终点标记">
            <option value="start" selected>仅起点</option>
            <option value="both">起点 + 终点</option>
            <option value="none">不标</option>
          </select>
        </label>
        <label>
          <span>页数</span>
          <input id="pages" type="number" inputmode="numeric"
                 min="1" max="50" step="1" value="3" aria-label="页数">
        </label>
        <label class="full-row">
          <span>文件名前缀（PDF 用，可选）</span>
          <input id="prefix" type="text" placeholder="例如：1班" maxlength="40"
                 autocomplete="off" aria-label="文件名前缀">
        </label>
      </div>
      <div class="actions">
        <button id="btn-generate" class="btn-primary"   type="button">生成题纸</button>
        <button id="btn-download" class="btn-tertiary"  type="button">下载 PDF</button>
        <button id="btn-print"    class="btn-secondary" type="button">打印</button>
      </div>
    </div>

    <main id="output">
      <div class="empty-hint">点击「生成题纸」开始</div>
    </main>
  </div>

<script>
(function () {
  'use strict';

  // ---------- 视觉样式（屏幕 / PDF 共用）----------
  // 颜色与几何参数集中在这里，方便整体调整。
  // 默认使用"软蓝底 + 绿/琥珀强调"配色：
  //   - 普通格用浅蓝 (blue-100)，浅而柔和，玩家可在纸上做标记
  //   - 起点用翠绿 (emerald-500)，"出发"语义直观且醒目
  //   - 终点用琥珀 (amber-500)，与绿色对比强且对色弱友好（避开红绿配对）
  //   - 外边框用中性灰蓝 (slate-400)
  // 如果想要其他风格，可整体替换 ACTIVE/START/END/BORDER：
  //   样图同款冷灰蓝：ACTIVE='#cdd9e1' START='#475569' END='#94a3b8' BORDER='#94a3b8'
  //   暖色奶油：    ACTIVE='#fef3c7' START='#b45309' END='#f97316' BORDER='#d6d3d1'
  //   薄荷绿：      ACTIVE='#d1fae5' START='#065f46' END='#14b8a6' BORDER='#a7f3d0'
  //   粉紫：        ACTIVE='#ede9fe' START='#6d28d9' END='#ec4899' BORDER='#c4b5fd'
  var STYLE = {
    ACTIVE: '#dbeafe',   // 普通激活格
    START:  '#10b981',   // 起点
    END:    '#f59e0b',   // 终点
    BORDER: '#94a3b8',   // 外边框

    CELL_GAP_RATIO:    0.10,  // 格间留白 / 单元格边长
    CELL_RADIUS_RATIO: 0.18,  // 格圆角半径 / 内格边长

    BORDER_STROKE_VB:    0.05,   // 外边框线宽（viewBox 单位）
    BORDER_RADIUS_RATIO: 0.05,   // 外边框圆角半径 / 棋盘总边长
    BORDER_STROKE_MM:    0.5     // PDF 外边框线宽（mm）
  };

  // 难度比例：激活格数 = round(ratio × n²)，下界为 4。
  var DIFFICULTY_RATIO = {
    easy:   0.50,
    medium: 0.70,
    hard:   0.90
  };

  // ---------- 工具 ----------
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function hexToRgb(hex) {
    hex = String(hex).replace('#', '');
    if (hex.length === 3) {
      hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    }
    return {
      r: parseInt(hex.slice(0, 2), 16),
      g: parseInt(hex.slice(2, 4), 16),
      b: parseInt(hex.slice(4, 6), 16)
    };
  }
  function todayString() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  // ---------- 1. 哈密顿路径生成 ----------
  // 在 n×n 上从随机起点出发，做长度 = target 的不重复 4-邻接随机游走。
  // 关键：用 Warnsdorff 启发——每步优先走到"剩余空邻居最少"的方向，
  //   能极大降低回溯成本；同分时随机决定，保证每次形状不同。
  // 失败路径会回溯；总步数上限作为安全阀，避免极端情况下卡住。
  function generatePath(n, target) {
    if (target < 1 || target > n * n) return null;
    var DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]];

    for (var attempt = 0; attempt < 80; attempt++) {
      var visited = [];
      for (var i = 0; i < n; i++) visited.push(new Array(n).fill(false));
      var path = [];
      var stepBudget = { left: 200000 };

      // 用函数表达式 + 闭包，避免严格模式下块级函数声明的提升行为差异。
      var walk = function (r, c) {
        if (--stepBudget.left <= 0) return false;
        visited[r][c] = true;
        path.push([r, c]);
        if (path.length === target) return true;

        // 收集未访问邻居 + 计算它们各自的"未访问邻居数"
        var cands = [];
        for (var d = 0; d < 4; d++) {
          var nr = r + DIRS[d][0];
          var nc = c + DIRS[d][1];
          if (nr < 0 || nr >= n || nc < 0 || nc >= n) continue;
          if (visited[nr][nc]) continue;
          var cnt = 0;
          for (var d2 = 0; d2 < 4; d2++) {
            var nnr = nr + DIRS[d2][0];
            var nnc = nc + DIRS[d2][1];
            if (nnr < 0 || nnr >= n || nnc < 0 || nnc >= n) continue;
            if (!visited[nnr][nnc]) cnt++;
          }
          cands.push({ r: nr, c: nc, deg: cnt, rand: Math.random() });
        }
        // Warnsdorff: 度数升序，同分随机
        cands.sort(function (a, b) { return a.deg - b.deg || a.rand - b.rand; });

        for (var k = 0; k < cands.length; k++) {
          if (walk(cands[k].r, cands[k].c)) return true;
          if (stepBudget.left <= 0) break;
        }

        // 回溯
        visited[r][c] = false;
        path.pop();
        return false;
      };

      var ok = walk(
        Math.floor(Math.random() * n),
        Math.floor(Math.random() * n)
      );

      if (ok) {
        var cells = [];
        for (var rr = 0; rr < n; rr++) cells.push(new Array(n).fill(false));
        for (var p = 0; p < path.length; p++) cells[path[p][0]][path[p][1]] = true;
        return {
          cells:   cells,
          startRC: path[0].slice(),
          endRC:   path[path.length - 1].slice(),
          path:    path
        };
      }
    }
    return null;
  }

  // ---------- 2. 多题多页 ----------
  // 单题失败时降低 1~2 格再试（保持版面）；连续失败则放占位 null（renderFromData 会跳过）。
  function buildPuzzles(n, ratio, pageCount) {
    var target = Math.max(4, Math.round(ratio * n * n));
    var pages = [];
    for (var p = 0; p < pageCount; p++) {
      var boards = [];
      for (var b = 0; b < 6; b++) {
        var data = generatePath(n, target);
        if (!data && target > 4) data = generatePath(n, target - 1);
        if (!data && target > 5) data = generatePath(n, target - 2);
        boards.push(data);
      }
      pages.push(boards);
    }
    return pages;
  }

  // ---------- 3. SVG 渲染 ----------
  var SVG_NS = 'http://www.w3.org/2000/svg';

  function fillForCell(boardData, r, c, markMode) {
    var sr = boardData.startRC[0], sc = boardData.startRC[1];
    var er = boardData.endRC[0],   ec = boardData.endRC[1];
    if (r === sr && c === sc) {
      if (markMode === 'start' || markMode === 'both') return STYLE.START;
    } else if (r === er && c === ec && markMode === 'both') {
      return STYLE.END;
    }
    return STYLE.ACTIVE;
  }

  function renderBoard(boardData, n, markMode) {
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'board');
    svg.setAttribute('xmlns', SVG_NS);
    // 外边框线宽会以 viewBox 中心线居中渲染，需向外扩 stroke/2 + 一点余量，
    // 否则线宽外侧会被 viewBox 裁切。
    var pad = STYLE.BORDER_STROKE_VB;
    svg.setAttribute('viewBox',
      (-pad) + ' ' + (-pad) + ' ' + (n + 2 * pad) + ' ' + (n + 2 * pad));
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.setAttribute('shape-rendering', 'geometricPrecision');

    var gap   = STYLE.CELL_GAP_RATIO;       // 占一个 cell（1）的比例
    var inner = 1 - gap;                    // 实际绘制矩形边长
    var rx    = inner * STYLE.CELL_RADIUS_RATIO;

    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (!boardData.cells[r][c]) continue;
        var rect = document.createElementNS(SVG_NS, 'rect');
        rect.setAttribute('x', c + gap / 2);
        rect.setAttribute('y', r + gap / 2);
        rect.setAttribute('width',  inner);
        rect.setAttribute('height', inner);
        rect.setAttribute('rx', rx);
        rect.setAttribute('ry', rx);
        rect.setAttribute('fill', fillForCell(boardData, r, c, markMode));
        svg.appendChild(rect);
      }
    }

    // 外边框（矩形圆角，描边不填充）。
    var border = document.createElementNS(SVG_NS, 'rect');
    var borderR = n * STYLE.BORDER_RADIUS_RATIO;
    border.setAttribute('x', 0);
    border.setAttribute('y', 0);
    border.setAttribute('width',  n);
    border.setAttribute('height', n);
    border.setAttribute('rx', borderR);
    border.setAttribute('ry', borderR);
    border.setAttribute('fill', 'none');
    border.setAttribute('stroke', STYLE.BORDER);
    border.setAttribute('stroke-width', STYLE.BORDER_STROKE_VB);
    svg.appendChild(border);

    return svg;
  }

  function renderFromData(pages, n, markMode) {
    var output = document.getElementById('output');
    output.innerHTML = '';
    var date = todayString();
    var totalPages = pages.length;

    for (var p = 0; p < totalPages; p++) {
      var page = document.createElement('section');
      page.className = 'page';

      var header = document.createElement('div');
      header.className = 'page-header';
      var left = document.createElement('span');
      left.textContent = date;
      var right = document.createElement('span');
      right.textContent = (p + 1) + ' / ' + totalPages;
      header.appendChild(left);
      header.appendChild(right);

      var grid = document.createElement('div');
      grid.className = 'boards-grid';

      var boards = pages[p];
      for (var b = 0; b < boards.length; b++) {
        if (boards[b]) {
          grid.appendChild(renderBoard(boards[b], n, markMode));
        } else {
          var ph = document.createElement('div');
          ph.className = 'board';
          grid.appendChild(ph);
        }
      }

      page.appendChild(header);
      page.appendChild(grid);
      output.appendChild(page);
    }
  }

  // ---------- 4. PDF 输出 ----------
  function getJsPDF() {
    return (window.jspdf && window.jspdf.jsPDF) || null;
  }

  function sanitizePrefix(prefix) {
    if (!prefix) return '';
    return String(prefix)
      .replace(/[<>:"/\\|?*\x00-\x1f]/g, '')
      .replace(/^[-\s]+|[-\s]+$/g, '');
  }

  function buildFilename(prefix, n, pageCount) {
    var base = 'onestroke-' + n + 'x' + n + '-' + pageCount + 'p-' + todayString() + '.pdf';
    var clean = sanitizePrefix(prefix);
    return clean ? (clean + '-' + base) : base;
  }

  // 在 PDF 页 (x,y) 处画一块 size × size mm 的题板（左上角对齐）。
  // 与屏幕 SVG 同样的 gap / radius 比例，保证视觉一致。
  function drawBoardPDF(doc, boardData, n, x, y, size, markMode) {
    var cell  = size / n;
    var gap   = STYLE.CELL_GAP_RATIO * cell;
    var inner = cell - gap;
    var rx    = inner * STYLE.CELL_RADIUS_RATIO;

    doc.setLineWidth(0); // 仅填色，无边线
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (!boardData.cells[r][c]) continue;
        var rgb = hexToRgb(fillForCell(boardData, r, c, markMode));
        doc.setFillColor(rgb.r, rgb.g, rgb.b);
        doc.roundedRect(
          x + c * cell + gap / 2,
          y + r * cell + gap / 2,
          inner, inner, rx, rx, 'F'
        );
      }
    }

    // 外边框
    var brgb = hexToRgb(STYLE.BORDER);
    doc.setDrawColor(brgb.r, brgb.g, brgb.b);
    doc.setLineWidth(STYLE.BORDER_STROKE_MM);
    var br = size * STYLE.BORDER_RADIUS_RATIO;
    doc.roundedRect(x, y, size, size, br, br, 'S');
  }

  function downloadPDF() {
    var JsPDF = getJsPDF();
    if (!JsPDF) {
      alert('PDF 库未加载，请检查网络后刷新页面再试。');
      return;
    }
    if (!currentPuzzles.length) {
      alert('请先点击「生成题纸」。');
      return;
    }

    var doc = new JsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

    // 与 Queens 一致的版面参数
    var pageW = 210;
    var pad = 12, colGap = 8, rowGap = 6;
    var boardSize = 83;
    var colWidth  = (pageW - 2 * pad - colGap) / 2;
    var headerY   = pad + 5;
    var boardsStartY = pad + 12;

    var date = todayString();
    var totalPages = currentPuzzles.length;
    var n = currentN;
    var markMode = currentMarkMode;

    doc.setProperties({
      title:   '一笔画题纸',
      subject: 'One-stroke puzzles ' + n + 'x' + n + ' x ' + (totalPages * 6),
      creator: 'one-stroke-print-generator',
      author:  'one-stroke-print-generator'
    });

    for (var p = 0; p < totalPages; p++) {
      if (p > 0) doc.addPage();

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10.5);
      doc.setTextColor(75, 85, 99);
      doc.text(date, pad, headerY);
      var pageStr = (p + 1) + ' / ' + totalPages;
      var tw = doc.getTextWidth(pageStr);
      doc.text(pageStr, pageW - pad - tw, headerY);

      var boards = currentPuzzles[p];
      for (var b = 0; b < boards.length; b++) {
        if (!boards[b]) continue;
        var col = b % 2;
        var row = Math.floor(b / 2);
        var cellX = pad + col * (colWidth + colGap);
        var cellY = boardsStartY + row * (boardSize + rowGap);
        var bx = cellX + (colWidth - boardSize) / 2;
        drawBoardPDF(doc, boards[b], n, bx, cellY, boardSize, markMode);
      }
    }

    var prefix = document.getElementById('prefix').value || '';
    doc.save(buildFilename(prefix, n, totalPages));
  }

  // ---------- 5. 状态保存（PDF / 重渲染共用）----------
  var currentPuzzles  = [];
  var currentN        = 6;
  var currentMarkMode = 'start';

  // ---------- 6. 持久化 ----------
  var STORAGE_KEY = 'one-stroke-print-generator:v1';
  function loadSettings() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data && data.size) {
        var opt = document.querySelector('#size option[value="' + data.size + '"]');
        if (opt) document.getElementById('size').value = String(data.size);
      }
      if (data && data.difficulty) {
        var optD = document.querySelector('#difficulty option[value="' + data.difficulty + '"]');
        if (optD) document.getElementById('difficulty').value = data.difficulty;
      }
      if (data && data.markMode) {
        var optM = document.querySelector('#markMode option[value="' + data.markMode + '"]');
        if (optM) document.getElementById('markMode').value = data.markMode;
      }
      if (data && data.pages) {
        document.getElementById('pages').value = String(data.pages);
      }
      if (data && typeof data.prefix === 'string') {
        document.getElementById('prefix').value = data.prefix;
      }
    } catch (e) { /* 忽略 */ }
  }
  function saveSettings() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        size:       document.getElementById('size').value,
        difficulty: document.getElementById('difficulty').value,
        markMode:   document.getElementById('markMode').value,
        pages:      document.getElementById('pages').value,
        prefix:     document.getElementById('prefix').value || ''
      }));
    } catch (e) { /* 忽略 */ }
  }

  // ---------- 7. 输入读取 ----------
  function readInputs() {
    var size = parseInt(document.getElementById('size').value, 10);
    if (!(size >= 4 && size <= 7)) size = 6;

    var difficulty = document.getElementById('difficulty').value;
    if (!DIFFICULTY_RATIO[difficulty]) difficulty = 'medium';

    var markMode = document.getElementById('markMode').value;
    if (markMode !== 'start' && markMode !== 'both' && markMode !== 'none') markMode = 'start';

    var pages = parseInt(document.getElementById('pages').value, 10);
    if (!isFinite(pages) || pages < 1) pages = 1;
    if (pages > 50) pages = 50;
    document.getElementById('pages').value = String(pages);

    return {
      size: size,
      difficulty: difficulty,
      markMode: markMode,
      pages: pages
    };
  }

  function disable(buttons, disabled) {
    buttons.forEach(function (b) { if (b) b.disabled = disabled; });
  }

  function updatePDFButtonAvailability() {
    var btnD = document.getElementById('btn-download');
    if (!btnD) return;
    if (getJsPDF()) {
      btnD.disabled = false;
      btnD.title = '';
    } else {
      btnD.disabled = true;
      btnD.title = 'PDF 库未加载，请检查网络后刷新';
    }
  }

  function generate() {
    var btnG = document.getElementById('btn-generate');
    var btnP = document.getElementById('btn-print');
    var btnD = document.getElementById('btn-download');
    var input = readInputs();
    saveSettings();

    btnG.textContent = '生成中…';
    disable([btnG, btnP, btnD], true);

    setTimeout(function () {
      try {
        currentN        = input.size;
        currentMarkMode = input.markMode;
        currentPuzzles  = buildPuzzles(input.size, DIFFICULTY_RATIO[input.difficulty], input.pages);
        renderFromData(currentPuzzles, input.size, input.markMode);
      } finally {
        btnG.textContent = '生成题纸';
        disable([btnG, btnP, btnD], false);
        updatePDFButtonAvailability();
      }
    }, 30);
  }

  // ---------- 8. 事件绑定 ----------
  document.addEventListener('DOMContentLoaded', function () {
    loadSettings();

    document.getElementById('btn-generate').addEventListener('click', generate);

    document.getElementById('btn-download').addEventListener('click', function () {
      if (!currentPuzzles.length) {
        var input = readInputs();
        saveSettings();
        currentN        = input.size;
        currentMarkMode = input.markMode;
        currentPuzzles  = buildPuzzles(input.size, DIFFICULTY_RATIO[input.difficulty], input.pages);
        renderFromData(currentPuzzles, input.size, input.markMode);
      }
      saveSettings();
      downloadPDF();
    });

    document.getElementById('btn-print').addEventListener('click', function () {
      var hasPages = !!document.querySelector('.page');
      if (!hasPages) {
        generate();
        setTimeout(function () { window.print(); }, 80);
      } else {
        window.print();
      }
    });

    // 切换棋盘 / 难度 / 起终点标记 → 自动重新生成（与 Queens 切换 size 同款）
    document.getElementById('size').addEventListener('change', generate);
    document.getElementById('difficulty').addEventListener('change', generate);
    document.getElementById('markMode').addEventListener('change', generate);
    // 页数 / 前缀仅持久化，避免在连续输入时反复跑算法
    document.getElementById('pages').addEventListener('change', saveSettings);
    document.getElementById('prefix').addEventListener('input',  saveSettings);

    // jsPDF 异步加载完成 / 失败后再更新「下载 PDF」按钮状态
    updatePDFButtonAvailability();
    if (!getJsPDF()) {
      var jsPdfScript = document.querySelector('script[src*="jspdf"]');
      if (jsPdfScript) {
        jsPdfScript.addEventListener('load',  updatePDFButtonAvailability);
        jsPdfScript.addEventListener('error', updatePDFButtonAvailability);
      }
      var tries = 0;
      var timer = setInterval(function () {
        tries++;
        if (getJsPDF() || tries > 10) {
          clearInterval(timer);
          updatePDFButtonAvailability();
        }
      }, 500);
    }

    // 进入页面默认生成一次
    generate();
  });
})();
</script>
</body>
</html>
